# NeMo Guardrails config.yml excerpt: input and output rails are lists of flows.
# "self check input/output/facts" also need their prompts defined in the config
# (see the NeMo Guardrails configuration guide).
rails:
  input:
    flows:
      - self check input
      - mask sensitive data on input
  output:
    flows:
      - self check output
      - self check facts
